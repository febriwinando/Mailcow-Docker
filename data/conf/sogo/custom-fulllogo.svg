<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="2800"
     height="720"
     viewBox="0 0 2800 720">

    <defs>
        <linearGradient id="mailGradient" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#005BAC"/>
            <stop offset="100%" stop-color="#009944"/>
        </linearGradient>
    </defs>

    <!-- Icon -->
    <g transform="translate(40,40)">

        <!-- Background Icon -->
        <rect x="0"
              y="0"
              width="560"
              height="560"
              rx="110"
              fill="url(#mailGradient)"/>

        <!-- Envelope -->
        <rect x="110"
              y="150"
              width="340"
              height="260"
              rx="20"
              fill="#FFFFFF"/>

        <!-- Envelope Flap -->
        <path d="M110 150
                 L280 290
                 L450 150"
              fill="none"
              stroke="#005BAC"
              stroke-width="20"
              stroke-linecap="round"
              stroke-linejoin="round"/>

        <!-- Bottom folds -->
        <path d="M110 410
                 L235 290"
              fill="none"
              stroke="#D6D6D6"
              stroke-width="12"
              stroke-linecap="round"/>

        <path d="M450 410
                 L325 290"
              fill="none"
              stroke="#D6D6D6"
              stroke-width="12"
              stroke-linecap="round"/>

    </g>

    <!-- Text -->
    <text x="700"
          y="300"
          font-family="Poppins, Segoe UI, Arial, sans-serif"
          font-size="220"
          font-weight="700"
          fill="#005BAC">
        PEMERINTAH KOTA
    </text>

    <text x="700"
          y="480"
          font-family="Poppins, Segoe UI, Arial, sans-serif"
          font-size="180"
          font-weight="500"
          fill="#444444">
        TEBING TINGGI
    </text>

    <text x="700"
          y="610"
          font-family="Poppins, Segoe UI, Arial, sans-serif"
          font-size="94"
          fill="#777777">
        Official Mail Service
    </text>

</svg>